services:
  frontend:
    image: ${FRONTEND_IMAGE:-dalia-cakes-frontend:local}
    container_name: dalia_cakes_frontend
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - dalia-cakes-network
    restart: unless-stopped
    

  database:
    image: postgres:16-alpine
    container_name: dalia_cakes_database
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dalia-cakes-network
    restart: unless-stopped

  app:
    image: ${APP_IMAGE:-dalia-cakes:local}
    container_name: dalia_cakes_app
    env_file: .env
    environment:
      DB_HOST: database
      DB_URL: ${DOCKER_DB_URL}
      ALEMBIC_DB_URL: ${DOCKER_DB_URL}
      LOG_FORMAT: json
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - dalia-cakes-network
    restart: unless-stopped
    command: uvicorn backend.src.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
    driver: local

networks:
  dalia-cakes-network:
    external: true
