# ==============================================================================
# DEPLOY PIPELINE — Dalia Cakes API
# ==============================================================================
#
# PIPELINE STAGES:
#
#   SOURCE  →  BUILD  →  DEPLOY
#
#   [lint]           Static code analysis
#   [test-unit]      Unit tests
#   [build-image]    Validates Docker image builds correctly (no push)
#   [publish-image]  Publishes image to GHCR tagged with commit SHA
#   [deploy-ec2]     Deploys to EC2 via SSH with health check and rollback
#
# ==============================================================================

name: Backend — Deploy Pipeline

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'migrations/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'requirements.txt'
      - 'alembic.ini'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'migrations/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'requirements.txt'
      - 'alembic.ini'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Cancels previous runs on the same branch to prevent overlapping deploys.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/dalia-cakes-api
  PYTHON_VERSION: "3.12"

# ==============================================================================
# STAGE: SOURCE
# ==============================================================================

jobs:

  # ----------------------------------------------------------------------------
  # Lint
  # ----------------------------------------------------------------------------
  lint:
    name: Source — Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pylint
        run: pylint backend/src/

  # ----------------------------------------------------------------------------
  # Unit tests
  # ----------------------------------------------------------------------------
  test-unit:
    name: Source — Unit Tests
    runs-on: ubuntu-latest
    env:
      DB_URL: "sqlite:///:memory:"
      SECRET_KEY: testsecretkey
      ALGORITHM: HS256
      GEMINI_API_KEY: fake_key
      GEMINI_MODEL: gemini-2.5-flash
      AWS_ACCESS_KEY_ID: fake_key
      AWS_SECRET_ACCESS_KEY: fake_secret
      AWS_S3_BUCKET: fake-bucket
      AWS_S3_REGION: us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest backend/src/tests/unit_tests/ -q --tb=short

  # ----------------------------------------------------------------------------
  # Integration tests
  # ----------------------------------------------------------------------------
  test-integration:
    name: Source — Integration Tests
    runs-on: ubuntu-latest
    env:
      DB_URL: "sqlite:///:memory:"
      SECRET_KEY: testsecretkey
      ALGORITHM: HS256
      GEMINI_API_KEY: fake_key
      GEMINI_MODEL: gemini-2.5-flash
      AWS_ACCESS_KEY_ID: fake_key
      AWS_SECRET_ACCESS_KEY: fake_secret
      AWS_S3_BUCKET: fake-bucket
      AWS_S3_REGION: us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration tests
        run: pytest backend/src/tests/integration_tests/ -q --tb=short

# ==============================================================================
# STAGE: BUILD
# ==============================================================================

  # ----------------------------------------------------------------------------
  # Build image (validation only, no push)
  # Runs on every PR so broken Dockerfiles are caught before merge.
  # ----------------------------------------------------------------------------
  build-image:
    name: Build — Validate Image
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-integration]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: local/dalia-cakes-api:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Publish image to GHCR (main branch only)
  # ----------------------------------------------------------------------------
  publish-image:
    name: Build — Publish Image
    runs-on: ubuntu-latest
    needs: build-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Define image tag
        id: vars
        run: echo "image_tag=sha-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ==============================================================================
# STAGE: DEPLOY
# ==============================================================================

  deploy-ec2:
    name: Deploy — EC2
    runs-on: ubuntu-latest
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy docker-compose.yml to server
        run: |
          scp -i ~/.ssh/ec2_key.pem \
            docker-compose.yml \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_DEPLOY_PATH }}/docker-compose.yml

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: "ghcr.io/${{ github.repository_owner }}/dalia-cakes-api:${{ needs.publish-image.outputs.image_tag }}"
          GHCR_PAT: ${{ secrets.CONTAINER_REGISTRY_TOKEN }}
          GHCR_USER: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: APP_IMAGE,GHCR_PAT,GHCR_USER,DEPLOY_PATH
          script: |
            set -Eeuo pipefail
            cd "$DEPLOY_PATH"
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull app
            PREV_IMAGE=$(docker inspect --format='{{.Config.Image}}' dalia_cakes_app 2>/dev/null || true)
            rollback() {
              echo "⚠️  Deploy failed. Starting rollback..."
              if [ -n "$PREV_IMAGE" ]; then
                export APP_IMAGE="$PREV_IMAGE"
                docker compose up -d app
                echo "✅ Rollback completed: $PREV_IMAGE"
              else
                echo "ℹ️  No previous image found — skipping rollback (first deploy)."
              fi
            }
            trap rollback ERR
            export APP_IMAGE="$APP_IMAGE"
            docker compose up -d --remove-orphans
            docker compose exec -T app alembic upgrade head
            echo "Waiting for application to be ready..."
            for i in $(seq 1 5); do
              if curl -fsS http://localhost:8000/health >/dev/null; then
                echo "✅ Health check passed"
                break
              fi
              if [ "$i" -eq 5 ]; then
                echo "❌ Health check failed after 5 attempts"
                exit 1
              fi
              echo "Attempt $i/5 failed — retrying in 5s..."
              sleep 5
            done
            docker image prune -f
            echo "🚀 Deploy complete: $APP_IMAGE"

